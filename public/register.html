<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üye Ol | BiletBul</title>
    <style>
        :root {
            /* Soft Pastel Pembe Vurgu Renkleri */
            --primary-accent: #FFB6C1; 
            --accent-glow: rgba(255, 182, 193, 0.4);
            
            /* Başarı/Onay Renkleri */
            --success-color: #2ecc71;
            --success-glow: rgba(46, 204, 113, 0.4);

            --pure-black: #000000;
            --card-bg: rgba(20, 20, 20, 0.85);
            --border-color: #333333;
            --text-main: #FFFFFF;
            --text-muted: #888888;
        }

        color-scheme: dark;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--pure-black);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            /* ARKA PLAN GÖRSELİ */
            background-image: url('registergorsel.png'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
        }

        /* HEADER TASARIMI */
        header {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            color: var(--pure-black);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px var(--primary-accent);
            text-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .logo:hover { color: var(--primary-accent); }

        .header-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .header-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .header-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary-accent);
            transition: width 0.3s ease;
        }

        .header-links a:hover { color: var(--text-main); }
        .header-links a:hover::after { width: 100%; }

        /* KAYIT SAYFASI ÖZEL YERLEŞİMİ (Ortalanmış) */
        .register-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        /* CAM EFEKTLİ KART */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 550px;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary-accent);
            box-shadow: 0 0 15px var(--primary-accent);
        }

        .glass-card h2 {
            font-size: 26px;
            margin-bottom: 5px;
            color: var(--text-main);
            text-align: center;
            font-weight: 600;
        }

        .glass-card p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* INPUT GRUPLARI */
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input, .input-group select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            padding: 14px 15px;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group select option { background: var(--card-bg); color: white; }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.2);
            background: rgba(0, 0, 0, 0.8);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .input-group {
            flex: 1;
        }

        /* SÖZLEŞME ONAYI */
        .agreement-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 25px;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .agreement-group a { color: var(--primary-accent); text-decoration: none; transition: color 0.3s; }
        .agreement-group a:hover { color: #FFC0CB; text-decoration: underline; }

        /* BUTONLAR */
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            border: none;
        }

        .btn-primary { background: var(--primary-accent); color: var(--pure-black); }
        .btn-primary:hover { background: #FFC0CB; transform: translateY(-2px); box-shadow: 0 10px 25px var(--accent-glow); }

        /* GİRİŞE DÖN LİNKİ */
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
        .login-link a { color: var(--primary-accent); text-decoration: none; font-weight: bold; margin-left: 5px; transition: color 0.3s; }
        .login-link a:hover { color: #FFC0CB; text-decoration: underline; }

        /* --- BAŞARI EKRANI (Üyelik Sonrası) --- */
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8) translate(-50%, -50%); }
            to { opacity: 1; transform: scale(1) translate(-50%, -50%); }
        }

        .success-section {
            background: var(--card-bg);
            border: none; 
            padding: 60px 40px; 
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 -2px 15px var(--success-glow), 0 2px 15px var(--success-glow);  
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 650px; 
            text-align: center;
            display: none; /* Başlangıçta Gizli */
            flex-direction: column;
            align-items: center;
            position: fixed; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 1000; 
        }

        .success-icon {
            width: 90px;
            height: 90px;
            background: transparent;
            border: 4px solid var(--success-color);
            color: var(--success-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px var(--success-glow);
        }

        .success-section h2 { font-size: 28px; color: var(--text-main); margin-bottom: 20px; line-height: 1.4; }
        .success-section p { font-size: 18px; color: var(--text-muted); margin-bottom: 10px; }

        .inline-logo {
            font-size: 24px; font-weight: 900; color: var(--pure-black); text-decoration: none;
            letter-spacing: 1px; text-transform: uppercase; -webkit-text-stroke: 1px var(--primary-accent);
            text-shadow: 0 0 10px var(--accent-glow); transition: all 0.3s ease; display: inline-block;
            margin-left: 5px; vertical-align: baseline; position: relative; top: 3px;
        }

        .inline-logo:hover { color: var(--primary-accent); transform: scale(1.05) translateY(-2px); text-shadow: 0 0 20px var(--accent-glow); }

    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">BiletBul</a>
        <div class="header-links">
            <a href="#">🇹🇷 TRY</a>
            <a href="#">Yardım</a>
            <a href="sorgula.html">Seyahat Sorgula</a>
            <a href="login.html">Üye Girişi</a>
        </div>
    </header>

    <div class="register-wrapper">
        
        <div class="glass-card" id="registerCard">
            <h2>Aramıza Katılın</h2>
            <p class="subtitle">Saniyeler içinde üye ol, avantajları yakala</p>
            
            <form id="registerForm">
                
                <div class="input-group">
                    <label for="tcNo">TC Kimlik Numarası (11 Hane)</label>
                    <input type="text" id="tcNo" maxlength="11" placeholder="11122233344" required>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="ad">Adınız</label>
                        <input type="text" id="ad" placeholder="Örn: Ayşe" required>
                    </div>
                    <div class="input-group">
                        <label for="soyad">Soyadınız</label>
                        <input type="text" id="soyad" placeholder="Örn: Yılmaz" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="cinsiyet">Cinsiyet</label>
                        <select id="cinsiyet" required>
                            <option value="" disabled selected>Seçiniz</option>
                            <option value="K">Kadın</option>
                            <option value="E">Erkek</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="phone">Cep Telefonu</label>
                        <input type="tel" id="phone" placeholder="05XX XXX XX XX" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-Posta Adresi</label>
                    <input type="email" id="email" placeholder="ornek@mail.com" required>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="password">Şifre</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="input-group">
                        <label for="confirm_password">Şifre Tekrar</label>
                        <input type="password" id="confirm_password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="agreement-group">
                    <input type="checkbox" id="agreement" style="width:16px; height:16px; margin-top: 3px; accent-color: var(--primary-accent);" required>
                    <label for="agreement">
                        <a href="#">Kullanım Koşulları</a>'nı ve <a href="#">Gizlilik Politikası</a>'nı okudum, kabul ediyorum.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Üyeliğimi Oluştur</button>
                
                <div class="login-link">
                    Zaten üye misiniz? <a href="login.html">Giriş Yap</a>
                </div>
            </form>
        </div>

        <div class="success-section" id="successSection">
            <div class="success-icon">✔</div>
            <h2>Üyeliğiniz başarılı şekilde oluşturulmuştur!</h2>
            <p>Gezi rotan hazırsa hadi <a href="index.html" class="inline-logo">BiletBul</a>!</p>
        </div>

    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const sifre = document.getElementById('password').value;
            const sifreTekrar = document.getElementById('confirm_password').value;
            
            if(sifre !== sifreTekrar) {
                alert("Şifreler birbiriyle eşleşmiyor!");
                return;
            }

            const tcNo = document.getElementById('tcNo').value;
            if(tcNo.length !== 11) {
                alert("TC Kimlik Numarası 11 haneli olmalıdır!");
                return;
            }

            const btn = document.querySelector('.btn-primary');
            btn.innerHTML = "⏳ Kaydediliyor...";
            btn.disabled = true;

            const userData = {
                tcNo: tcNo,
                ad: document.getElementById('ad').value,
                soyad: document.getElementById('soyad').value,
                cinsiyet: document.getElementById('cinsiyet').value,
                telefon: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                sifre: sifre
            };

            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();

                if (data.success) {
                    // Üyelik formunu gizle
                    document.getElementById('registerCard').style.display = 'none';
                    // Başarı ekranını animasyonla göster (Glow efektli asil ekran)
                    document.getElementById('successSection').style.display = 'flex';
                    
                    // 7 Saniye sonra giriş ekranına yolla
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 7000);
                } else {
                    alert(data.message);
                    btn.innerHTML = "Üyeliğimi Oluştur";
                    btn.disabled = false;
                }

            } catch(err) {
                console.error("Kayıt hatası:", err);
                alert("Sunucu ile bağlantı kurulamadı!");
                btn.innerHTML = "Üyeliğimi Oluştur";
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
